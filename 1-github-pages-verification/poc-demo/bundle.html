<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>尋找你的靈魂氣質色｜小紅書心理測驗 PoC</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
/* Modern CSS Design for Xiaohongshu Psychological Quiz PoC */
:root {
  --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #31103f 100%);
  --card-bg: rgba(255, 255, 255, 0.08);
  --card-border: rgba(255, 255, 255, 0.15);
  --primary-glow: linear-gradient(135deg, #ff2a6d 0%, #9900f0 100%);
  --accent-pink: #ff2a6d;
  --accent-purple: #9900f0;
  --text-main: #f8fafc;
  --text-sub: #cbd5e1;
  --font-family: 'Noto Sans TC', 'Outfit', sans-serif;
  --radius-lg: 24px;
  --radius-md: 16px;
  --shadow-glow: 0 10px 30px rgba(153, 0, 240, 0.3);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: var(--font-family);
  background: var(--bg-gradient);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
  overflow-x: hidden;
}

.app-container {
  width: 100%;
  max-width: 430px;
  min-height: 680px;
  background: rgba(15, 23, 42, 0.7);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-lg);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
  position: relative;
  overflow: hidden;
  padding: 28px 20px;
}

.screen {
  display: none;
  flex-direction: column;
  height: 100%;
  animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.screen.active {
  display: flex;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.badge {
  align-self: center;
  font-size: 0.75rem;
  font-weight: 500;
  padding: 6px 14px;
  background: rgba(255, 42, 109, 0.15);
  color: var(--accent-pink);
  border: 1px solid rgba(255, 42, 109, 0.3);
  border-radius: 20px;
  margin-bottom: 24px;
  letter-spacing: 0.5px;
}

.hero-graphic {
  position: relative;
  height: 160px;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 20px;
}

.glow-sphere {
  position: absolute;
  border-radius: 50%;
  filter: blur(35px);
}

.sphere-1 {
  width: 120px;
  height: 120px;
  background: var(--accent-pink);
  opacity: 0.5;
  top: 10px;
  left: 25%;
}

.sphere-2 {
  width: 100px;
  height: 100px;
  background: var(--accent-purple);
  opacity: 0.6;
  bottom: 10px;
  right: 25%;
}

.hero-icon {
  font-size: 4rem;
  z-index: 2;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.title {
  font-size: 1.65rem;
  font-weight: 700;
  text-align: center;
  margin-bottom: 10px;
  background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.subtitle {
  font-size: 0.9rem;
  color: var(--text-sub);
  text-align: center;
  line-height: 1.5;
  margin-bottom: 30px;
  padding: 0 10px;
}

.code-verify-box {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-md);
  padding: 16px;
  margin-bottom: 24px;
}

.code-verify-box label {
  display: block;
  font-size: 0.82rem;
  color: var(--text-sub);
  margin-bottom: 8px;
}

.code-verify-box input {
  width: 100%;
  padding: 12px;
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  color: #fff;
  font-size: 1rem;
  letter-spacing: 2px;
  text-align: center;
  outline: none;
  transition: border-color 0.2s;
}

.code-verify-box input:focus {
  border-color: var(--accent-pink);
}

.error-msg {
  color: #ff4d4d;
  font-size: 0.78rem;
  margin-top: 6px;
  text-align: center;
}

.btn {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 15px;
  border-radius: var(--radius-md);
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.25s ease;
}

.btn-primary {
  background: var(--primary-glow);
  color: #ffffff;
  box-shadow: var(--shadow-glow);
}

.btn-primary:active {
  transform: scale(0.98);
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.1);
  color: var(--text-main);
  border: 1px solid var(--card-border);
}

.btn-pulse {
  animation: pulseGlow 2.5s infinite;
}

@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 15px rgba(255, 42, 109, 0.4); }
  50% { box-shadow: 0 0 30px rgba(153, 0, 240, 0.7); }
}

.quiz-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
}

.progress-bar-bg {
  flex: 1;
  height: 8px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--primary-glow);
  transition: width 0.3s ease;
}

.step-indicator {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-sub);
}

.question-text {
  font-size: 1.25rem;
  line-height: 1.4;
  margin-bottom: 24px;
}

.options-container {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.option-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-md);
  padding: 16px;
  color: var(--text-main);
  font-size: 0.95rem;
  text-align: left;
  cursor: pointer;
  transition: all 0.2s ease;
  line-height: 1.4;
}

.option-btn:hover, .option-btn:active {
  background: rgba(255, 42, 109, 0.15);
  border-color: var(--accent-pink);
  transform: translateX(4px);
}

.result-card {
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-lg);
  padding: 24px 20px;
  margin-bottom: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}

.result-badge {
  font-size: 0.75rem;
  background: rgba(255, 255, 255, 0.15);
  padding: 4px 12px;
  border-radius: 12px;
  margin-bottom: 16px;
}

.result-color-preview {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 2.2rem;
  margin-bottom: 12px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
}

.result-title {
  font-size: 1.5rem;
  margin-bottom: 6px;
}

.result-keywords {
  font-size: 0.85rem;
  color: var(--accent-pink);
  margin-bottom: 18px;
}

.result-section {
  width: 100%;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}

.result-section h3 {
  font-size: 0.85rem;
  color: var(--text-sub);
  margin-bottom: 8px;
}

.result-section p {
  font-size: 0.88rem;
  line-height: 1.5;
  color: #e2e8f0;
}

.traits-grid {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 8px;
}

.trait-item {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 0.8rem;
}

.trait-label {
  width: 70px;
  color: var(--text-sub);
}

.trait-bar {
  flex: 1;
  height: 6px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 3px;
  overflow: hidden;
}

.trait-fill {
  height: 100%;
  background: var(--primary-glow);
  border-radius: 3px;
}

.result-footer {
  margin-top: 18px;
  font-size: 0.72rem;
  color: rgba(255, 255, 255, 0.4);
}

.action-buttons {
  display: flex;
  gap: 12px;
}
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Start Screen -->
    <div id="start-screen" class="screen active">
      <div class="badge">小紅書虛擬商品 ‧ 靜態Web POC</div>
      <div class="hero-graphic">
        <div class="glow-sphere sphere-1"></div>
        <div class="glow-sphere sphere-2"></div>
        <div class="hero-icon">✨</div>
      </div>
      <h1 class="title">探索你的「靈魂氣質色」</h1>
      <p class="subtitle">只需 4 題，解鎖專屬於你的性格色彩密碼與氣質分析</p>

      <button id="start-btn" class="btn btn-primary btn-pulse">
        <span>開始靈魂測驗</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="screen">
      <div class="quiz-header">
        <div class="progress-bar-bg">
          <div id="progress-fill" class="progress-fill" style="width: 25%;"></div>
        </div>
        <div class="step-indicator">
          <span id="current-step">1</span> / <span id="total-steps">4</span>
        </div>
      </div>

      <div class="question-card">
        <h2 id="question-text" class="question-text">載入問題中...</h2>
        <div id="options-container" class="options-container">
          <!-- Options dynamically rendered -->
        </div>
      </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="screen">
      <div class="result-card" id="result-card">
        <div class="result-badge" id="result-tag">靈魂色調</div>
        <div class="result-color-preview" id="result-color-bg">
          <span class="color-symbol" id="result-emoji">🎨</span>
        </div>
        <h2 class="result-title" id="result-title">淡雅薄荷綠</h2>
        <p class="result-keywords" id="result-keywords">#冷靜理智 #直覺敏銳 #獨特審美</p>
        
        <div class="result-section">
          <h3>🌟 靈魂性格解讀</h3>
          <p id="result-desc">你擁有讓人感到放鬆的療癒力量，同時內心擁有極高的專注力與敏銳的直覺...</p>
        </div>

        <div class="result-section">
          <h3>💡 幸運特質指標</h3>
          <div class="traits-grid">
            <div class="trait-item">
              <span class="trait-label">直覺指數</span>
              <div class="trait-bar"><div class="trait-fill" id="trait-1" style="width: 85%;"></div></div>
            </div>
            <div class="trait-item">
              <span class="trait-label">療癒能力</span>
              <div class="trait-bar"><div class="trait-fill" id="trait-2" style="width: 92%;"></div></div>
            </div>
            <div class="trait-item">
              <span class="trait-label">創造天賦</span>
              <div class="trait-bar"><div class="trait-fill" id="trait-3" style="width: 78%;"></div></div>
            </div>
          </div>
        </div>

        <div class="result-footer">
          <p>小紅書專屬靈魂測驗卡 ‧ 存圖分享</p>
        </div>
      </div>

      <div class="action-buttons">
        <button id="restart-btn" class="btn btn-secondary">重新測驗</button>
        <button id="share-btn" class="btn btn-primary">保存結果卡片</button>
      </div>
    </div>
  </div>

  <script>
const questions = [
  {
    id: 1,
    question: "在寂靜的夜晚，你走進一座神祕的花園，最吸引你注意的景緻是？",
    options: [
      { text: "A. 散發微光的月光湖泊", trait: "mint" },
      { text: "B. 盛開著金金色微光的花叢", trait: "gold" },
      { text: "C. 懸浮在半空中的古老時鐘", trait: "violet" },
      { text: "D. 靜謐悠揚的露天鋼琴", trait: "rose" }
    ]
  },
  {
    id: 2,
    question: "當你需要沉澱情緒、重新充電時，你通常偏好哪種方式？",
    options: [
      { text: "A. 獨自一人聽音樂、讀書或思考", trait: "mint" },
      { text: "B. 約三五好友聚會聊天分享歡笑", trait: "gold" },
      { text: "C. 嘗試全新的興趣或創作點子", trait: "violet" },
      { text: "D. 在溫馨的空間享受美食與追劇", trait: "rose" }
    ]
  },
  {
    id: 3,
    question: "朋友通常如何形容你的性格特色？",
    options: [
      { text: "A. 冷靜理智，總是能給出溫和又中肯的建議", trait: "mint" },
      { text: "B. 熱情真誠，像陽光般感染身邊所有人", trait: "gold" },
      { text: "C. 直覺敏銳，充滿神祕感與獨特審美", trait: "violet" },
      { text: "D. 細心體貼，溫柔包容大家的喜怒哀樂", trait: "rose" }
    ]
  },
  {
    id: 4,
    question: "面對生活中的未知挑戰時，你的第一反應是？",
    options: [
      { text: "A. 迅速條理分明地分析情勢與應對方案", trait: "mint" },
      { text: "B. 抱持樂觀自信，相信船到橋頭自然直", trait: "gold" },
      { text: "C. 順從直覺，尋求突破常規的新解法", trait: "violet" },
      { text: "D. 尋求信任夥伴的支持，共同穩步推進", trait: "rose" }
    ]
  }
];

const resultsData = {
  mint: {
    title: "淡雅薄荷綠",
    emoji: "🌿",
    bg: "linear-gradient(135deg, #10b981 0%, #059669 100%)",
    keywords: "#冷靜清澈 #洞察力強 #靈魂療癒者",
    desc: "你的靈魂呈現清澈的薄荷綠色。你擁有極佳的內省能力與冷靜的思維，不論外界如何喧囂，你總是能在心中保持一片寧靜的森林。你是朋友身邊最值得信賴的傾聽者與智囊。",
    t1: 90, t2: 95, t3: 82
  },
  gold: {
    title: "耀眼香檳金",
    emoji: "✨",
    bg: "linear-gradient(135deg, #f59e0b 0%, #d97706 100%)",
    keywords: "#陽光自信 #感染力十足 #正能量源泉",
    desc: "你的靈魂散發著溫暖燦爛的香檳金光芒。你天生具備吸引人的魅力與正能量，總是能為周遭帶來歡笑與希望。你的存在就像是一道明亮的陽光，溫暖著每個遇到你的人。",
    t1: 75, t2: 88, t3: 95
  },
  violet: {
    title: "神祕夢幻紫",
    emoji: "🔮",
    bg: "linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%)",
    keywords: "#獨特審美 #直覺敏銳 #靈感充沛",
    desc: "你的靈魂包裹著深邃神祕的夢幻紫。你擁有極高的品味與非凡的直覺，常常能察覺他人忽略的細節與美感。你的世界豐富多彩，充滿無限的想像力與藝術靈感。",
    t1: 95, t2: 80, t3: 98
  },
  rose: {
    title: "溫柔玫瑰粉",
    emoji: "🌸",
    bg: "linear-gradient(135deg, #ec4899 0%, #be185d 100%)",
    keywords: "#細膩共情 #溫柔包容 #情感豐富",
    desc: "你的靈魂帶有柔軟美好的玫瑰粉色。你擁有極強的同理心與共情能力，總是能感知他人的情感並給予無微不至的關懷。你帶給這個世界無限的柔情與溫暖。",
    t1: 82, t2: 98, t3: 85
  }
};

let currentQuestionIndex = 0;
let userScores = { mint: 0, gold: 0, violet: 0, rose: 0 };

const startScreen = document.getElementById('start-screen');
const quizScreen = document.getElementById('quiz-screen');
const resultScreen = document.getElementById('result-screen');
const startBtn = document.getElementById('start-btn');

const progressFill = document.getElementById('progress-fill');
const currentStepSpan = document.getElementById('current-step');
const totalStepsSpan = document.getElementById('total-steps');
const questionText = document.getElementById('question-text');
const optionsContainer = document.getElementById('options-container');

const restartBtn = document.getElementById('restart-btn');
const shareBtn = document.getElementById('share-btn');

document.addEventListener('DOMContentLoaded', () => {
  totalStepsSpan.textContent = questions.length;
  startBtn.addEventListener('click', handleStart);
  restartBtn.addEventListener('click', handleRestart);
  shareBtn.addEventListener('click', handleSaveResult);
});

function handleStart() {
  startScreen.classList.remove('active');
  quizScreen.classList.add('active');
  currentQuestionIndex = 0;
  userScores = { mint: 0, gold: 0, violet: 0, rose: 0 };
  renderQuestion();
}

function renderQuestion() {
  const currentQ = questions[currentQuestionIndex];
  const progressPercent = ((currentQuestionIndex + 1) / questions.length) * 100;
  progressFill.style.width = `${progressPercent}%`;
  currentStepSpan.textContent = currentQuestionIndex + 1;
  questionText.textContent = currentQ.question;
  optionsContainer.innerHTML = '';
  
  currentQ.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt.text;
    btn.addEventListener('click', () => selectOption(opt.trait));
    optionsContainer.appendChild(btn);
  });
}

function selectOption(trait) {
  userScores[trait] = (userScores[trait] || 0) + 1;
  if (currentQuestionIndex < questions.length - 1) {
    currentQuestionIndex++;
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  quizScreen.classList.remove('active');
  resultScreen.classList.add('active');
  
  let topTrait = 'mint';
  let maxScore = -1;
  for (const trait in userScores) {
    if (userScores[trait] > maxScore) {
      maxScore = userScores[trait];
      topTrait = trait;
    }
  }
  
  const result = resultsData[topTrait];
  document.getElementById('result-title').textContent = result.title;
  document.getElementById('result-emoji').textContent = result.emoji;
  document.getElementById('result-color-bg').style.background = result.bg;
  document.getElementById('result-keywords').textContent = result.keywords;
  document.getElementById('result-desc').textContent = result.desc;
  document.getElementById('trait-1').style.width = `${result.t1}%`;
  document.getElementById('trait-2').style.width = `${result.t2}%`;
  document.getElementById('trait-3').style.width = `${result.t3}%`;
}

function handleRestart() {
  resultScreen.classList.remove('active');
  startScreen.classList.add('active');
}

function handleSaveResult() {
  alert('✨ 測驗結果卡片已準備完畢！在手機瀏覽器中可長按畫面或截圖保存分享至小紅書！');
}
  </script>
</body>
</html>
