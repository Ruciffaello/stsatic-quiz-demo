<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>月兔搗麻糬｜OnePage 心理測驗</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@500;600;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .result-capture { position: relative; isolation: isolate; }
    .result-capture .result-moon { top: 11px; }
    .start-screen { justify-content: space-between; padding: 30px 22px 24px; }
    .hero-moon-stage { position: relative; width: 250px; height: 250px; margin: 10px auto 0; display: flex; align-items: center; justify-content: center; }
    .start-screen .hero-moon { position: absolute; z-index: 0; inset: 0; width: auto; height: auto; transform: none; background: radial-gradient(circle at 45% 45%, #fffdf4 0%, #fae19c 48%, #e2b04f 95%); box-shadow: 0 0 32px rgba(255,215,120,.45), 0 0 70px rgba(220,140,40,.22); animation: moon-pulse 4s ease-in-out infinite alternate; }
    .start-screen .hero-moon::after { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 75% 30%, rgba(200,145,50,.22) 0%, transparent 45%); content: ""; }
    .start-screen h1 { position: relative; z-index: 2; margin: 0 0 0 .16em; font-family: "Noto Serif TC", serif; font-size: 33px; font-weight: 900; line-height: 1.25; letter-spacing: .16em; background: linear-gradient(180deg, #57131a 0%, #30080d 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 1px 0 rgba(255,245,210,.85)) drop-shadow(0 3px 6px rgba(100,20,25,.28)); }
    .osmanthus { z-index: 3; right: -8px; top: 28px; color: #ffd88a; font-size: 13px; line-height: 1.45; letter-spacing: 0; transform: none; filter: drop-shadow(0 0 6px rgba(255,215,120,.8)); animation: twinkle 2.2s infinite ease-in-out alternate; }
    .hero-copy { margin: 14px 0 0; padding: 0; border: 0; border-radius: 0; background: none; color: #ecdcc1; font-size: 13px; font-weight: 400; line-height: 1.65; letter-spacing: .04em; text-shadow: 0 2px 8px rgba(0,0,0,.8); }
    .hero-rabbit { width: 160px; height: 160px; margin: 8px auto 0; }
    .hero-rabbit img { display: block; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 12px 16px rgba(0,0,0,.35)); }
    .bottom-action-group { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: auto; padding-top: 10px; }
    .start-screen .primary-btn { width: 100%; max-width: 320px; margin-top: 0; padding: 14px 20px; border: 1.5px solid var(--gold); border-radius: 14px; font-size: 16px; font-weight: 700; letter-spacing: .12em; }
    .start-screen .footnote { margin: 0; color: rgba(245,231,203,.65); font-size: 11.5px; letter-spacing: .15em; }
    @keyframes moon-pulse { from { transform: scale(1); filter: brightness(1); } to { transform: scale(1.02); filter: brightness(1.06); } }
    @keyframes twinkle { from { opacity: .5; transform: scale(.9); } to { opacity: 1; transform: scale(1.1); } }
    .r-ear { top: -10px; height: 78px; }
    .r-body { background: rgb(237, 237, 237); }
    .pound-halo { top: 30px; }
    .pound-rabbit { top: 40px; }
    .p-head { width: 80px; height: 74px; border-radius: 50% 50% 46% 46%; }
    .p-ear { top: -12px; width: 26px; height: 92px; }
    .p-ear-right { right: 46px; }
    .p-ear::after { inset: 10px 6px; }
    .p-body { bottom: 22px; left: 39px; width: 88px; height: 78px; border-radius: 42% 48% 46% 46% / 55% 58% 42% 45%; background: linear-gradient(175deg, #ffffff 0%, #f6efe9 100%); transform: rotate(3deg); }
    .pestle-hand { position: absolute; z-index: 2; width: 28px; height: 20px; border: 1px solid rgba(135,94,91,.2); border-radius: 50%; background: #fff; }
    .pestle-hand-left { top: 57px; left: -18px; transform: rotate(20deg); }
    .pestle-hand-right { top: 82px; right: -18px; transform: rotate(-20deg); }
    .pound-pestle { top: 38px; width: 24px; }
    .pound-pestle::after { display: none; }
    .pound-mortar { bottom: 126px; }
    .pound-mochi { bottom: 164px; background: radial-gradient(circle at 50% 35%, var(--mix), #e5dac9); box-shadow: 0 0 16px rgba(255,255,255,.35); }
    .particle { background: #fff; }
    .p-one { bottom: 209px; }
    .p-two { bottom: 217px; }
    .p-three { bottom: 236px; }
    .r-face { position: absolute; z-index: 3; top: 54px; left: 62px; width: 29px; height: 20px; }
    .r-face::before { position: absolute; top: 0; left: 3px; width: 4px; height: 6px; border-radius: 50%; background: #4b3034; box-shadow: 18px 0 #4b3034; content: ""; }
    .r-face::after { position: absolute; top: 9px; left: 8px; width: 12px; height: 6px; border-bottom: 2px solid #9b5757; border-radius: 0 0 50% 50%; content: ""; }
    .p-face { position: absolute; z-index: 3; top: 74px; left: 69px; width: 32px; height: 22px; }
    .p-face::before { position: absolute; top: 0; left: 3px; width: 5px; height: 7px; border-radius: 50%; background: #4b3034; box-shadow: 20px 0 #4b3034; content: ""; }
    .p-face::after { position: absolute; top: 10px; left: 9px; width: 13px; height: 6px; border-bottom: 2px solid #9b5757; border-radius: 0 0 50% 50%; content: ""; }
    .result-limited { margin: 0 auto; color: #5f1720; font-family: "Noto Sans TC", sans-serif; font-size: 18px; font-weight: 900; letter-spacing: .2em; text-align: center; text-shadow: 0 1px rgba(255,250,225,.72); }
    .result-title { margin-top: 12px; }
    .result-title p { color: #19151a; font-family: "Noto Sans TC", sans-serif; font-size: 15px; font-weight: 900; letter-spacing: .1em; }
    .result-art { display: flex; flex-direction: column; align-items: center; height: 174px; margin: 9px auto 0; }
    .mochi-box { position: relative; display: flex; align-items: center; justify-content: center; width: 224px; height: 122px; border: 2px solid #f5c968; border-radius: 16px 16px 25px 25px; background: linear-gradient(145deg, #ca3b31, #7c1b21); box-shadow: inset 0 2px rgba(255,255,255,.25), 0 10px 18px rgba(0,0,0,.26); }
    .mochi-box::before { position: absolute; top: 11px; left: 16px; right: 16px; height: 16px; border-radius: 50%; background: rgba(62,15,18,.6); content: ""; }
    .result-mochi { position: relative; z-index: 1; width: 142px; height: 78px; border: 2px solid rgba(255,255,255,.56); border-radius: 48% 48% 43% 43%; background: radial-gradient(circle at 35% 25%, rgba(255,255,255,.66), transparent 22%), var(--mix); box-shadow: inset -8px -11px rgba(62,22,30,.16), 0 6px 10px rgba(0,0,0,.28); }
    .result-hero { position: relative; height: 360px; padding: 20px 0 18px; overflow: hidden; }
    .result-hero .result-moon { z-index: 0; top: 8px; width: 230px; height: 230px; box-shadow: 0 0 28px rgba(255,226,142,.56), 0 0 74px rgba(238,159,51,.25); }
    .result-hero .result-limited { position: relative; z-index: 1; width: fit-content; margin: 17px auto 0; padding: 5px 14px; border: 1px solid rgba(94,23,32,.5); border-radius: 99px; background: rgba(255,247,215,.5); font-size: 15px; letter-spacing: .16em; }
    .result-hero .result-title { position: relative; z-index: 3; margin-top: 25px; }
    .result-hero .result-title h2 { font-family: "Noto Serif TC", serif; font-size: 38px; font-weight: 900; }
    .result-hero #result-name { margin: 10px 0; }
    .result-hero .result-art { position: absolute; z-index: 2; right: 0; bottom: 0; left: 0; height: 112px; margin: 0 auto; }
    .result-hero .result-art { bottom: 18px; height: 116px; }
    .result-pastry { display: block; width: 224px; height: 134px; margin: -8px auto 0; filter: drop-shadow(0 8px 8px rgba(0,0,0,.25)); }
    .result-card { margin-top: 16px; }
    .result-card .card-label { font-size: 15px; }
    .result-card .meaning-summary { margin: 5px 0 8px; color: #ffe3a3; font-family: "Noto Sans TC", sans-serif; font-size: 13px; font-weight: 400; line-height: 1.65; }
    .result-card .meaning-summary .card-label { display: block; margin-bottom: 3px; }
    .result-card .result-blessing { display: block; color: #ffe3a3; text-align: center; }
    .result-supports { display: grid; gap: 4px; padding-top: 8px; border-top: 1px solid rgba(255,210,125,.18); }
    .result-supports .support-label { color: #f4c970; font-size: 14px; font-weight: 800; letter-spacing: .13em; }
    .result-support { margin: 0; color: #e8dac4; font-size: 11px; line-height: 1.55; }
    .result-support b { color: #f4c970; font-family: "Noto Sans TC", sans-serif; }
    .result-screen .result-actions button { font-family: "Noto Sans TC", sans-serif; font-weight: 800; }
    .result-screen.is-legendary { background: radial-gradient(circle at 50% 15%, rgba(255,225,131,.22), transparent 35%), radial-gradient(circle at 50% 50%, #382c56 0%, #171222 58%, #0d0a14 100%); }
    .is-legendary .result-hero .result-moon { background: radial-gradient(circle at 42% 32%, #fffef2 0%, #fff3b6 35%, #f7c957 69%, #bb7720 100%); box-shadow: 0 0 36px rgba(255,227,126,.92), 0 0 108px rgba(246,184,59,.48); }
    .is-legendary .result-limited { border-color: rgba(255,235,157,.9); background: linear-gradient(90deg, #7b4b12, #d99a2e, #7b4b12); color: #fff9da; box-shadow: 0 0 18px rgba(255,207,88,.42); }
    .is-legendary .result-title h2 { color: #7a4b0d; text-shadow: 0 1px 0 #fff7c9, 0 0 14px rgba(255,223,116,.65); }
    .is-legendary .result-card { border-color: rgba(255,222,120,.78); background: linear-gradient(145deg, rgba(73,48,89,.94), rgba(33,19,48,.94)); box-shadow: 0 8px 28px rgba(255,196,61,.18); }
    .is-legendary .result-ingredients span { border-color: rgba(255,224,126,.6); background: rgba(255,225,130,.12); color: #fff1b4; }
    .is-legendary .result-supports .support-label, .is-legendary .result-support b { color: #ffe18b; }
  </style>
</head>
<body>
  <main class="app-shell">
    <div class="stars" aria-hidden="true"></div>

    <section id="start-screen" class="screen active start-screen">
      <div class="seal">福 · 月宮食譜 · 中秋大吉</div>
      <div class="hero-moon-stage"><div class="hero-moon" aria-hidden="true"></div><div class="osmanthus" aria-hidden="true">✦<br>✦<br>✦</div><h1>玉杵輕落<br>萬願成糬</h1></div>
      <p class="hero-copy">今夜金風盈室，月兔將替你搗製<br>一顆專屬的中秋祝福麻糬月餅</p>
      <div class="hero-rabbit" aria-hidden="true">
        <img src="assets/Rabbit holding moon cake_7223575.png" alt="">
      </div>
      <div class="bottom-action-group"><button id="start-btn" class="primary-btn">啟封月宮食譜 <span>➔</span></button><p class="footnote">一主二副 · 煉就一顆專屬月餅</p></div>
    </section>

    <section id="select-screen" class="screen select-screen" aria-live="polite">
      <div class="moon-floor" aria-hidden="true"></div>
      <header class="round-header">
        <span class="round-badge">玉兔搗製中</span>
        <span class="round-count"><b id="round-current">1</b> / 3</span>
      </header>
      <div class="selection-scene" aria-hidden="true">
        <div class="selection-rabbit"><span class="r-ear r-ear-left"></span><span class="r-ear r-ear-right"></span><span class="r-head"></span><span class="r-face"></span><span class="r-body"></span><span class="r-pestle"></span></div>
        <div id="mix-mochi" class="mix-mochi"></div>
        <div class="selection-mortar"></div>
      </div>
      <h2 id="ingredient-heading" class="ingredient-heading">第一味 · 選主食材</h2>
      <div id="ingredients-grid" class="ingredients-grid" role="list" aria-label="選擇食材"></div>
      <div id="selected-info" class="selected-info is-empty">
        <span class="selected-icon">✦</span>
        <div><strong>請挑選主食材</strong><span>它會決定這顆月餅的核心祝福</span></div>
      </div>
      <button id="add-btn" class="primary-btn add-btn" disabled>投入石臼 · 確認這一味 <span>➔</span></button>
      <p id="recipe-line" class="recipe-line">目前配方：尚未投入食材</p>
    </section>

    <section id="pounding-screen" class="screen pounding-screen" aria-live="polite">
      <div class="moon-floor" aria-hidden="true"></div>
      <header class="round-header"><span class="round-badge">玉兔搗製中</span><span class="round-count"><b id="pound-current">1</b> / 3</span></header>
      <p id="pound-selected" class="pound-selected"></p>
      <div class="pounding-scene" aria-hidden="true">
        <div class="pound-halo"></div>
        <div class="pound-rabbit"><span class="p-ear p-ear-left"></span><span class="p-ear p-ear-right"></span><span class="p-head"></span><span class="p-face"></span><span class="p-body"></span></div>
        <div class="pound-pestle"><span class="pestle-hand pestle-hand-left"></span><span class="pestle-hand pestle-hand-right"></span></div><div class="pound-mochi"></div><div class="pound-mortar"></div>
        <i class="particle p-one"></i><i class="particle p-two"></i><i class="particle p-three"></i>
      </div>
      <h2 id="pound-title">糬糬正在染上月色</h2>
      <p>玉杵輕落 · 福氣慢慢揉進來</p>
      <div class="pound-meter"><i></i></div>
    </section>

    <section id="result-screen" class="screen result-screen" aria-live="polite">
      <div class="result-stars" aria-hidden="true"></div>
      <div id="result-capture" class="result-capture">
        <div class="result-hero">
          <div class="result-moon" aria-hidden="true"></div>
          <div class="result-limited">中秋限定</div>
          <div class="result-title"><p>你搗出了</p><h2 id="result-name"></h2></div>
          <div class="result-art" aria-label="本次搗製的麻糬成品"><canvas id="result-pastry" class="result-pastry" width="600" height="360" aria-label="混色月餅成品"></canvas></div>
        </div>
        <article class="result-card">
          <span class="card-label">核心配方</span><div id="result-ingredients" class="result-ingredients"></div>
          <div class="meaning"><p class="meaning-summary"><span class="card-label">麻糬寓意：</span><span id="result-blessing" class="result-blessing"></span></p><div id="result-supports" class="result-supports"><span class="support-label">副效果</span></div></div>
          <div class="festival-greeting"><span class="card-label">中秋祝福</span><p>又到中秋佳節，祝大家花好月圓、人團圓，佳節愉快！也別忘了和朋友分享這份中秋麻糬，把祝福一起送出去～</p></div>
        </article>
      </div>
      <div class="result-actions"><button id="restart-btn" class="secondary-btn">再搗一顆</button><button id="share-btn" class="primary-btn">下載結果卡</button></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
