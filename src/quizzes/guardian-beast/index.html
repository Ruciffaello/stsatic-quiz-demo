<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>解鎖你的隱藏守護神獸 ｜ 小紅書專屬心理測驗</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-viewport">
    <!-- Start Screen -->
    <div id="start-screen" class="screen active">
      <div class="header-badge">🌌 星際遠古神殿 ‧ 守護靈獸診斷</div>
      <div class="hero-orbit">
        <div class="beast-preview-glow">🐉</div>
      </div>
      <h1 class="hero-title">解鎖你的「隱藏守護神獸」</h1>
      <p class="hero-subtitle">穿越星辰迷霧，發現潛伏在你靈魂深處的神秘神獸與天賦氣場</p>

      <button id="start-btn" class="btn btn-cyber">
        <span>喚醒神獸連結</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="screen">
      <div class="progress-track">
        <div id="progress-fill" class="progress-bar" style="width: 25%;"></div>
      </div>
      <div class="step-badge">
        <span id="curr-q">1</span> / 4 題
      </div>

      <div class="question-container">
        <div id="q-tag" class="q-tag">星際地圖 ‧ 第 1 站</div>
        <h2 id="q-title" class="q-title">載入問題中...</h2>
        <div id="options-grid" class="options-grid">
          <!-- Options rendered dynamically -->
        </div>
      </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="screen">
      <div id="result-card-box" class="result-card-box">
        <div class="card-header">
          <span class="card-brand">小紅書專屬 ‧ 守護神獸卡</span>
          <span id="serial-id" class="serial-id">NO.2026-8888</span>
        </div>

        <div id="aura-glow" class="beast-avatar-glow">
          <div id="beast-icon" class="beast-avatar">🦊</div>
        </div>

        <h2 id="beast-name" class="beast-title">觀星九尾狐</h2>
        <div id="aura-type" class="aura-type">【 氣場類型：神秘星辰 ‧ 高階洞察者 】</div>

        <div id="tags-row" class="tags-row">
          <!-- Tags rendered dynamically -->
        </div>

        <div class="analysis-section">
          <h3>🌟 神獸靈魂檔案</h3>
          <p id="analysis-text" class="analysis-text">你的靈魂深處住著一隻優雅的觀星靈狐...</p>
        </div>

        <div class="stats-section">
          <h3>⚡ 氣場屬性指標</h3>
          <div class="stat-row">
            <span class="stat-label">洞察天賦</span>
            <div class="stat-bar-bg"><div id="stat-1" class="stat-bar-fill" style="width: 90%;"></div></div>
            <span id="stat-num-1" class="stat-num">90</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">執行魅力</span>
            <div class="stat-bar-bg"><div id="stat-2" class="stat-bar-fill" style="width: 85%;"></div></div>
            <span id="stat-num-2" class="stat-num">85</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">共情氣場</span>
            <div class="stat-bar-bg"><div id="stat-3" class="stat-bar-fill" style="width: 95%;"></div></div>
            <span id="stat-num-3" class="stat-num">95</span>
          </div>
        </div>

        <div class="lucky-section">
          <p class="lucky-item">🍀 幸運色彩：<strong id="lucky-color">暗夜紫羅蘭</strong></p>
          <p id="lucky-quote" class="lucky-quote">「信任你的第一直覺，答案早已在你的心靈深處。」</p>
        </div>
      </div>

      <div class="result-actions">
        <button id="retest-btn" class="btn btn-secondary">重新喚醒</button>
        <button id="save-btn" class="btn btn-cyber">保存神獸卡片</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
