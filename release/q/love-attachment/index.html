        errorEl.textContent = '⚠️ 解鎖卡密錯誤，請重新核對小紅書自動發貨訊息！';
        btnEl.disabled = false;
        btnEl.textContent = '解鎖戀愛診斷 ➔';
      }
    });
  </script>
</body>
